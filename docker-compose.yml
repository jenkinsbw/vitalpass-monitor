services:
  postgres:
    image: postgres:17-alpine
    container_name: vitalpass-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: vitalpass
      POSTGRES_PASSWORD: vitalpass
      POSTGRES_DB: vitalpass
    volumes:
      - vitalpass_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalpass -d vitalpass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vitalpass_postgres:
